<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hafiz Royl Collection</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }
    header {
      background: #111827;
      color: white;
      padding: 28px 20px;
      text-align: center;
    }
    header h1 { margin: 0 0 8px; font-size: 30px; }
    header p { margin: 0; opacity: .85; }
    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 18px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }
    .card h2 { margin-top: 0; }
    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 24px;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      text-decoration: none;
    }
    footer {
      text-align: center;
      padding: 30px;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <h1>Hafiz Royl Collection</h1>
    <p>Welcome to our website</p>
  </header>

  <main>
    <section class="card">
      <h2>خوش آمدید</h2>
      <p>یہ آپ کی ویب سائٹ کا ہوم پیج ہے۔</p>
      <a class="btn" href="#">شروع کریں</a>
    </section>
  </main>

  <footer>
    © 2026 Hafiz Royl Collection
  </footer>
</body>
</html>
